# Cadet-Agent Continue Configuration
# Custom slash commands for workflow phase dispatch.
# Each command instructs the model to read the canonical skill file
# from .cadet/agent/core/skills/ as the primary instruction context.
#
# NOTE: The key `customCommands` is used for backward compatibility with
# older Continue versions. If commands do not appear in your Continue
# version, try renaming `customCommands` to `slashCommands`.

customCommands:
  - name: cadet-requirements
    description: Capture and validate Given/When/Then acceptance criteria for large changes
    prompt: |
      Read `.cadet/agent/core/cadet-agent.md` for the global directive.
      Read `.cadet/agent/core/skills/Requirements.md` as the primary instruction context.
      Follow every step in that skill file. Run the Gate Check first by reading `.cadet/state.json`.

  - name: cadet-architecture
    description: Produce a technical design and ADRs from approved requirements
    prompt: |
      Read `.cadet/agent/core/cadet-agent.md` for the global directive.
      Read `.cadet/agent/core/skills/Architecture.md` as the primary instruction context.
      Follow every step in that skill file. Run the Gate Check first by reading `.cadet/state.json`.

  - name: cadet-spike
    description: Answer a focused feasibility question for an unverified assumption
    prompt: |
      Read `.cadet/agent/core/cadet-agent.md` for the global directive.
      Read `.cadet/agent/core/skills/Spike.md` as the primary instruction context.
      Follow every step in that skill file. Run the Gate Check first by reading `.cadet/state.json`.

  - name: cadet-breakdown
    description: Decompose large work into epics and small implementable stories
    prompt: |
      Read `.cadet/agent/core/cadet-agent.md` for the global directive.
      Read `.cadet/agent/core/skills/StoryBreakdown.md` as the primary instruction context.
      Follow every step in that skill file. Run the Gate Check first by reading `.cadet/state.json`.

  - name: cadet-tdd
    description: Implement changes through red/green test-first cycles
    prompt: |
      Read `.cadet/agent/core/cadet-agent.md` for the global directive.
      Read `.cadet/agent/core/skills/TDD.md` as the primary instruction context.
      Follow every step in that skill file. Run the Gate Check first by reading `.cadet/state.json`.

  - name: cadet-debug
    description: Reproduce, isolate, and fix defects with regression protection
    prompt: |
      Read `.cadet/agent/core/cadet-agent.md` for the global directive.
      Read `.cadet/agent/core/skills/Debugging.md` as the primary instruction context.
      Follow every step in that skill file. Run the Gate Check first by reading `.cadet/state.json`.

  - name: cadet-review
    description: Non-skippable review against acceptance criteria, hard gates, and framework rules
    prompt: |
      Read `.cadet/agent/core/cadet-agent.md` for the global directive.
      Read `.cadet/agent/core/skills/CodeReview.md` as the primary instruction context.
      Follow every step in that skill file. Run the Gate Check first by reading `.cadet/state.json`.

  - name: cadet-resume
    description: Inspect .cadet/state.json and resume the workflow from the last recorded phase
    prompt: |
      Read `.cadet/agent/core/cadet-agent.md` for the global directive.
      Read `.cadet/agent/core/skills/Resume.md` as the primary instruction context.
      Follow every step in that skill file. Check whether `.cadet/state.json` exists, report the current state, and suggest the next action.

  - name: cadet-mcp-setup
    description: Install the Pipeline package and register Unity's built-in MCP server to connect Cadet to the Editor
    prompt: |
      Read `.cadet/agent/core/cadet-agent.md` for the global directive.
      Read `.cadet/agent/core/skills/MCPSetup.md` as the primary instruction context.
      Follow every step in that skill file. Read `.cadet/agent/core/UnityCli.md` for the gate → command → state contract.

  - name: cadet-agent-reviewer
    description: Audit Cadet Agent's work against framework rules and process requirements
    prompt: |
      Read `.cadet/agent/core/cadet-agent.md`, then read `.cadet/agent/core/skills/AgentReviewer.md` as the primary instruction context — in full, including the `<role>` block. Follow every step in that file.
