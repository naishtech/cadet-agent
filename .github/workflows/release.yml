name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    name: Build and publish release
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Run package-agent.ps1
        shell: pwsh
        run: ./package-agent.ps1

      - name: Build the npm tarball
        run: npm pack

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            cadet-agent.zip
            cadet-unreal-*.zip
            cadet-agent-*.tgz
          generate_release_notes: true
